<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Charity Event Junction</title>

        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/home.js" defer></script>
    </head>

    <body>
        <header class="site-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">Charity Event Junction</a>

                <div class="nav-links">
                    <a class="active" href="/">Home</a>
                    <a href="/search">Find Event</a>
                    <a href="/#about">About</a>
                    <a href="/#contact">Contact</a>
                </div>

                <a class="nav-button" href="/search">Explore Event</a>
            </nav>

        </header>

        <main>
            <section class=""hero>
                <div class="hero-content">
                    <p class="eyebrown">Local causes. Meaningful action.</p>

                    <h1>
                        Find event that make a 
                        <span>real difference.</span>
                    </h1>

                    <p class="hero-description">
                        Discover charity events across the Gold Coast and connect

                    </p>

                    <div class="hero-actions">
                        <a class="primary-button" href="/search">
                            Find an Event
                        </a>

                        <a class="secondary-button" href="#upcoming-events">
                            View Upcoming
                        </a>
                    </div>
                </div>
            </section>
        </main>
